name: Build demo executables

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            artifact: CharacterCounter-Windows
            executable: CharacterCounter.exe
            pyinstaller_args: --windowed
          - name: macOS
            os: macos-latest
            artifact: CharacterCounter-macOS
            executable: CharacterCounter
            pyinstaller_args: --windowed
          - name: Linux
            os: ubuntu-latest
            artifact: CharacterCounter-Linux
            executable: CharacterCounter
            pyinstaller_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6,<7"

      - name: Build executable
        run: >
          python -m PyInstaller
          --onefile
          --name CharacterCounter
          ${{ matrix.platform.pyinstaller_args }}
          src/character_counter/main.py

      - name: Package executable
        shell: bash
        run: |
          mkdir -p artifact release-staging release

          if [[ "${{ matrix.platform.os }}" == "macos-latest" ]]; then
            if [[ -f "dist/${{ matrix.platform.executable }}" ]]; then
              cp "dist/${{ matrix.platform.executable }}" artifact/
              cp "dist/${{ matrix.platform.executable }}" release-staging/
              chmod +x "artifact/${{ matrix.platform.executable }}"
              chmod +x "release-staging/${{ matrix.platform.executable }}"
            fi

            if [[ -d "dist/CharacterCounter.app" ]]; then
              ditto -c -k --keepParent dist/CharacterCounter.app artifact/CharacterCounter.app.zip
              cp -R dist/CharacterCounter.app release-staging/
            fi
          else
            cp "dist/${{ matrix.platform.executable }}" artifact/
            cp "dist/${{ matrix.platform.executable }}" release-staging/
            if [[ "${{ matrix.platform.os }}" != "windows-latest" ]]; then
              chmod +x "artifact/${{ matrix.platform.executable }}"
              chmod +x "release-staging/${{ matrix.platform.executable }}"
            fi
          fi

          compgen -G "artifact/*" > /dev/null || {
            echo "No packaged executable found."
            exit 1
          }

          compgen -G "release-staging/*" > /dev/null || {
            echo "No release asset contents found."
            exit 1
          }

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          staging = Path("release-staging")
          zip_path = Path("release") / "${{ matrix.platform.artifact }}.zip"

          with ZipFile(zip_path, "w", ZIP_DEFLATED) as archive:
              for path in sorted(staging.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(staging))
          PY

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: artifact/

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}-ReleaseAsset
          path: release/*.zip

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-ReleaseAsset"
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Character Counter ${{ github.ref_name }}
          files: release-assets/*.zip
