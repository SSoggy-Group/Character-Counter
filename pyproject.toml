[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "character-counter-maaren"
version = "0.1.0"
authors = [
  { name="Maaren", email="maaren@example.com" },
]
description = "A text character and word counter tool with a GUI and CLI."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # No external dependencies currently required
]

[project.urls]
"Homepage" = "https://github.com/maaren/Character-Counter"
"Bug Tracker" = "https://github.com/maaren/Character-Counter/issues"

[project.scripts]
charcount = "character_counter.main:main"
